name: Preview Deploy

on:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install and build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: jj-psalm95
          workload_identity_provider: projects/883447693683/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@jj-psalm95.iam.gserviceaccount.com

      - name: Deploy preview channel
        id: deploy
        run: |
          CHANNEL="pr-${{ github.event.number }}"
          npx firebase-tools hosting:channel:deploy "$CHANNEL" \
            --project jj-psalm95 --expires 7d --non-interactive --json > deploy-output.json
          URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('deploy-output.json')).result['jj-psalm95'].url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} \
            --body "🔗 Preview deployed: ${{ steps.deploy.outputs.url }}"
