name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Artist pages are prerendered at build time, and their <title> and og:description carry
  # the artist's rank ("BLACKPINK — #2 of 107"). Rankings recompute hourly, so between
  # deploys those baked-in numbers drift from the live board — after the popularity source
  # changed, one artist's card read #10 while the board said #100. A nightly rebuild keeps
  # the crawler- and scraper-visible copy honest without touching anything else.
  # 18:00 UTC = 03:00 KST: quiet for the primary audience, and clear of the daily snapshot
  # (23:50 UTC) and the Monday weekly reset (00:00 UTC).
  schedule:
    - cron: '0 18 * * *'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend deps and build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: jj-psalm95
          workload_identity_provider: projects/883447693683/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@jj-psalm95.iam.gserviceaccount.com

      - name: Deploy to Firebase
        run: |
          npx firebase-tools deploy \
            --only hosting,functions,firestore:rules,firestore:indexes,storage \
            --project jj-psalm95 \
            --non-interactive
