<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=heart" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=heart" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=heart" />
    <meta name="theme-color" content="#c026d3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google AdSense (Auto Ads) -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6384977680679521"
      crossorigin="anonymous"
    ></script>

    <title>PsalmTune — Rank & explore K-pop, C-pop & J-pop artists</title>
    <meta
      name="description"
      content="PsalmTune is where Asian music lovers rank and get to know K-pop, C-pop & J-pop artists. Vote on your favorites, dive into member profiles (bios, positions, birthdays, fandoms), join a fandom and watch the live weekly race up the board."
    />
    <meta
      name="keywords"
      content="K-pop, C-pop, J-pop, Asian music, kpop ranking, idol ranking, kpop vote, fan voting, kpop members, idol profiles, member bios, kpop fandom, fandom leaderboard, kpop popularity, best kpop group, idol leaderboard, mandopop, jpop idols"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://psalmtune.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PsalmTune" />
    <meta property="og:title" content="PsalmTune — The people's ranking" />
    <meta
      property="og:description"
      content="Vote for the K-pop, C-pop & J-pop artists and bands you love, explore member profiles, and watch the live fandom race — a fan-driven ranking platform."
    />
    <meta property="og:url" content="https://psalmtune.com/" />
    <meta property="og:locale" content="en_US" />
    <!-- Default share card. Prerendered artist pages (scripts/prerender.mjs) swap this for
         a real photo; this is also the fallback used by src/hooks/usePageMeta.ts. -->
    <meta property="og:image" content="https://psalmtune.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="PsalmTune — the people's ranking for K-pop, C-pop and J-pop"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PsalmTune — The people's ranking" />
    <meta
      name="twitter:description"
      content="Vote for the K-pop, C-pop & J-pop artists and bands you love, explore member profiles, and watch the live fandom race."
    />
    <meta name="twitter:image" content="https://psalmtune.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="PsalmTune — the people's ranking for K-pop, C-pop and J-pop"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PsalmTune",
        "alternateName": "PsalmTune — The people's ranking",
        "url": "https://psalmtune.com/",
        "description": "A fan-driven ranking platform for Korean, Chinese, and Japanese pop artists, scored equally on online popularity and weekly and monthly fan votes.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://psalmtune.com/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PsalmTune",
        "url": "https://psalmtune.com/",
        "logo": "https://psalmtune.com/icon-512.png",
        "description": "A fan-driven ranking platform for K-pop, C-pop and J-pop artists."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
