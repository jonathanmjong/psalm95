<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=heart" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=heart" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=heart" />
    <meta name="theme-color" content="#c026d3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google AdSense (Auto Ads) -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6384977680679521"
      crossorigin="anonymous"
    ></script>

    <title>PsalmTune — Rank & explore K-pop, C-pop & J-pop artists</title>
    <meta
      name="description"
      content="PsalmTune is where Asian music lovers rank and get to know K-pop, C-pop & J-pop artists. Vote on your favorites, dive into member profiles (bios, positions, birthdays, fandoms), track popularity, discography and concerts, and find upcoming tour dates and tickets."
    />
    <meta
      name="keywords"
      content="K-pop, C-pop, J-pop, Asian music, kpop ranking, idol ranking, kpop vote, fan voting, kpop members, idol profiles, member bios, kpop concerts, concert tickets, tour dates, kpop popularity, best kpop group, idol leaderboard, mandopop, jpop idols"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://psalmtune.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PsalmTune" />
    <meta property="og:title" content="PsalmTune — The people's ranking" />
    <meta
      property="og:description"
      content="Vote for the K-pop, C-pop & J-pop artists and bands you love, explore member profiles, and follow their popularity, discography and concerts — a fan-driven ranking platform."
    />
    <meta property="og:url" content="https://psalmtune.com/" />
    <meta property="og:image" content="https://psalmtune.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PsalmTune — The people's ranking" />
    <meta
      name="twitter:description"
      content="Vote for the K-pop, C-pop & J-pop artists and bands you love, explore member profiles, and follow their popularity, discography and concerts."
    />
    <meta name="twitter:image" content="https://psalmtune.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PsalmTune",
        "alternateName": "PsalmTune — The people's ranking",
        "url": "https://psalmtune.com/",
        "description": "A fan-driven ranking platform for Korean, Chinese, and Japanese pop artists, scored on popularity, discography, concerts, and fan votes.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://psalmtune.com/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PsalmTune",
        "url": "https://psalmtune.com/",

      }
    </script>
